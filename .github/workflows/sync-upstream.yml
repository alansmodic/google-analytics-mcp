# Pull googleanalytics/google-analytics-mcp releases into this fork daily.
# Merges upstream/main, runs upstream's tests plus the remote wrapper's tests,
# and pushes to main only if everything passes (Railway auto-deploys main).
# On a merge conflict or test failure nothing is pushed and an issue is opened.
name: Sync upstream

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/googleanalytics/google-analytics-mcp.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git log --oneline HEAD..upstream/main
          git merge --no-edit upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v6
        if: steps.merge.outputs.changed == 'true'

      - name: Test merged code
        if: steps.merge.outputs.changed == 'true'
        run: |
          uv sync
          uv run --with pyfakefs python -m unittest discover -s tests -p "*_test.py"
          uv run --with pytest pytest -q -p no:warnings remote-server/test_server.py

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream sync failed ($(date -u +%Y-%m-%d))" \
            --body "The daily upstream merge or its tests failed, so nothing was deployed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
